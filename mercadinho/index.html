<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mercadinho</title>
    <link rel="stylesheet" href="estilo.css" />
    <script src="codigo.js" defer></script>
</head>

<body>
    <header>
        <h1>Mercadinho</h1>
        <button id="botao-tema" type="button">Modo Escuro</button>
    </header>

    <main>
        <section id="secao-produtos">
            <h2>Produtos</h2>

            <div id="lista-produtos">
                <article class="produto">
                    <img src="img/arroz.jpg" alt="Arroz 5kg" class="clicavel">
                    <h3>Arroz 5kg</h3>
                    <p>R$ <span class="preco">27.90</span></p>
                    <input type="text" class="editar-nome" placeholder="Nome">
                    <input type="number" class="editar-preco" step="0.01" min="0" placeholder="Preço">
                    <span class="erro"></span>
                    <button type="button" class="botao-adicionar">Adicionar</button>
                    <button type="button" class="botao-editar">Editar</button>
                    <button type="button" class="botao-remover">Remover</button>
                </article>

                <article class="produto">
                    <img src="img/feijao.jpg" alt="Feijão 1kg" class="clicavel">
                    <h3>Feijão 1kg</h3>
                    <p>R$ <span class="preco">8.50</span></p>
                    <input type="text" class="editar-nome" placeholder="Nome">
                    <input type="number" class="editar-preco" step="0.01" min="0" placeholder="Preço">
                    <span class="erro"></span>
                    <button type="button" class="botao-adicionar">Adicionar</button>
                    <button type="button" class="botao-editar">Editar</button>
                    <button type="button" class="botao-remover">Remover</button>
                </article>

                <article class="produto">
                    <img src="img/leite.jpg" alt="Leite 1L" class="clicavel">
                    <h3>Leite 1L</h3>
                    <p>R$ <span class="preco">5.49</span></p>
                    <input type="text" class="editar-nome" placeholder="Nome">
                    <input type="number" class="editar-preco" step="0.01" min="0" placeholder="Preço">
                    <span class="erro"></span>
                    <button type="button" class="botao-adicionar">Adicionar</button>
                    <button type="button" class="botao-editar">Editar</button>
                    <button type="button" class="botao-remover">Remover</button>
                </article>

                <article class="produto">
                    <img src="img/cafe.jpg" alt="Café 500g" class="clicavel">
                    <h3>Café 500g</h3>
                    <p>R$ <span class="preco">19.90</span></p>
                    <input type="text" class="editar-nome" placeholder="Nome">
                    <input type="number" class="editar-preco" step="0.01" min="0" placeholder="Preço">
                    <span class="erro"></span>
                    <button type="button" class="botao-adicionar">Adicionar</button>
                    <button type="button" class="botao-editar">Editar</button>
                    <button type="button" class="botao-remover">Remover</button>
                </article>

                <article class="produto">
                    <img src="img/pao.jpg" alt="Pão de forma" class="clicavel">
                    <h3>Pão de forma</h3>
                    <p>R$ <span class="preco">9.99</span></p>
                    <input type="text" class="editar-nome" placeholder="Nome">
                    <input type="number" class="editar-preco" step="0.01" min="0" placeholder="Preço">
                    <span class="erro"></span>
                    <button type="button" class="botao-adicionar">Adicionar</button>
                    <button type="button" class="botao-editar">Editar</button>
                    <button type="button" class="botao-remover">Remover</button>
                </article>
            </div>
        </section>

        <aside id="secao-carrinho">
            <h2>Carrinho</h2>
            <ul id="lista-carrinho">
            </ul>
            <p id="total">Total: R$ 0.00</p>
            <button id="botao-limpar" type="button">Limpar tudo</button>
        </aside>

        <section id="secao-cadastro">
            <h2>Cadastrar produto</h2>

            <form id="formulario">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome"
                        placeholder="Digite o nome do produto" autocomplete="off">
                    <span id="erro-nome" class="erro"></span>
                </div>

                <div class="campo">
                    <label for="foto">Foto (caminho ou URL)</label>
                    <input type="text" id="foto" name="foto"
                        placeholder="Ex.: img/arroz.jpg" autocomplete="off">
                    <span id="erro-foto" class="erro"></span>
                </div>

                <div class="campo">
                    <label for="preco">Valor (R$)</label>
                    <input type="number" id="preco" name="preco"
                        placeholder="Ex.: 10.50" step="0.01" min="0">
                    <span id="erro-preco" class="erro"></span>
                </div>

                <button type="submit">Salvar</button>
                <button type="reset">Limpar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Trabalho prático de Programação Web - UNIFTEC - Carlos Eduardo Marchonatto, Raphael Ben Luz, Lucas Moraes3</p>
    </footer>

</body>
</html>
